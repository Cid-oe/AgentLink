<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AgentLink</title>
  <desc id="desc">Turn ordinary chat sessions into persistent long-running AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#93c5fd" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M100 0V420M300 0V420M500 0V420M700 0V420M900 0V420M1100 0V420"/>
  </g>
  <circle cx="965" cy="95" r="92" fill="#7dd3fc" opacity="0.08"/>
  <circle cx="1045" cy="300" r="128" fill="#c084fc" opacity="0.08"/>
  <g transform="translate(92 76)">
    <text x="0" y="62" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="750">AgentLink</text>
    <rect x="0" y="88" width="410" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="140" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">Turn ordinary chat into long-running AI agents</text>
    <text x="0" y="180" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">long-turn continuity · durable state · tools · recovery</text>
    <text x="0" y="220" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Ask in chat. Keep working beyond one physical model turn.</text>
  </g>
  <g transform="translate(720 98)" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g filter="url(#glow)">
      <rect x="90" y="82" width="176" height="76" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
      <text x="178" y="126" fill="#f8fafc" font-size="22" font-weight="700">AgentLink</text>
    </g>
    <g fill="#0f172a" stroke="#64748b" stroke-width="1.5">
      <rect x="0" y="0" width="142" height="54" rx="14"/>
      <rect x="214" y="0" width="142" height="54" rx="14"/>
      <rect x="0" y="190" width="142" height="54" rx="14"/>
      <rect x="214" y="190" width="142" height="54" rx="14"/>
    </g>
    <g fill="#cbd5e1" font-size="16">
      <text x="71" y="33">Chat Thread</text>
      <text x="285" y="33">Durable State</text>
      <text x="71" y="223">Workers / Tools</text>
      <text x="285" y="223">Receipts</text>
    </g>
    <g stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.9">
      <path d="M115 54C115 84 122 94 142 102"/>
      <path d="M241 54C241 84 234 94 214 102"/>
      <path d="M142 148C122 160 115 174 115 190"/>
      <path d="M214 148C234 160 241 174 241 190"/>
    </g>
  </g>
  <text x="92" y="362" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Public demos + reproducible proofs · production core remains private</text>
</svg>