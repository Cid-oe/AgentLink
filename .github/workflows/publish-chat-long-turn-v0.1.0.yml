name: Publish Chat Long-Turn Continuity Demo v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-chat-long-turn-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish scoped demo release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: chat-long-turn-continuity-v0.1.0
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Chat Long-Turn Continuity Demo v0.1.0" \
            --notes-file demos/chat-long-turn-continuity/RELEASE_NOTES_v0.1.0.md
