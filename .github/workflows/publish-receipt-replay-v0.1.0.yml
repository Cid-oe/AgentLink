name: Publish Receipt Replay Simulator v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-receipt-replay-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish scoped demo release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: receipt-replay-simulator-v0.1.0
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Receipt Replay Simulator v0.1.0" \
            --notes-file demos/receipt-replay-simulator/RELEASE_NOTES_v0.1.0.md
