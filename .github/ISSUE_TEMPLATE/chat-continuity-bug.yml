name: Chat continuity demo bug
description: Report a reproducible issue in the MIT-licensed Chat Long-Turn Continuity Demo
title: "[continuity demo] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the public Chat Long-Turn Continuity Demo. Keep reports reproducible and sanitized. Do not include credentials, private endpoints, customer/user data, production logs, or unpublished AgentLink internals.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Python version used to run the demo.
      placeholder: "Fedora 43, Python 3.14"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command or step sequence
      description: Show the exact local commands or button sequence that reproduced the issue.
      placeholder: |
        cd demos/chat-long-turn-continuity
        python3 run_demo.py
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What continuity invariant did you expect to hold?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include sanitized output if useful.
    validations:
      required: true

  - type: dropdown
    id: boundary
    attributes:
      label: Where did continuity break?
      options:
        - Job initialization
        - Fresh-process continuation
        - Worker handoff / lease state
        - Deliberate interruption
        - Effect receipt / replay prevention
        - Resume / reconciliation
        - Final timeline / status
        - Other
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report safety
      options:
        - label: I removed credentials, private URLs, personal/customer data, production logs, and unpublished AgentLink internals from this report.
          required: true
        - label: I reproduced this against the public demo rather than inferring behavior from private production systems.
          required: true
